name: Release
on:
  release:
    types: [published]
jobs:
  lint:
    uses: ./.github/workflows/lint.yaml
  test:
    needs: lint
    uses: ./.github/workflows/test.yaml
  release_zip_file:
    # Only attach the zip HACS installs from when the released code passes the checks
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - shell: bash
        run: |
          version="${{ github.event.release.tag_name }}"
          version="${version,,}"
          yq e -P -o=json \
            -i ".version = \"${version}\"" \
            "${{ github.workspace }}/custom_components/homeconnect_ws/manifest.json"
      - run: |
          cd ${{ github.workspace }}/custom_components/homeconnect_ws
          zip homeconnect_ws.zip -r ./
      - uses: softprops/action-gh-release@v3.0.3
        with:
          files: ${{ github.workspace }}/custom_components/homeconnect_ws/homeconnect_ws.zip
